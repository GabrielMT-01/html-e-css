<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            
            
        }

        #boxa{
           flex: 1 0 150px;    
        }

        #boxb{
            flex: 0 1 150px;   
        }
        #boxc{
            flex: 0 4 150px;   
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="boxa">A</div>
        <div class="item" id="boxb">B</div>
        <div class="item" id="boxc">C</div>
    </div>
</body>
</html>
