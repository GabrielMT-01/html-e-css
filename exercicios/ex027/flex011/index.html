<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
            
        }

        #boxa{
           flex-shrink: 1;
           flex-grow: 0;     
        }

        #boxb{
            flex-shrink: 0;
            flex-grow: 1;     
        }
        #boxc{
            flex-shrink: 0;
            flex-grow: 4;     
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="boxa">A</div>
        <div class="item" id="boxb">B</div>
        <div class="item" id="boxc">C</div>
    </div>
</body>
</html>
